[package]
name = "inspecteye"
version = "0.1.0"
edition = "2021"
description = "A local-first codebase intelligence and observability application"
authors = ["Inspectye Contributors"]

[[bin]]
name = "inspecteye"
path = "src/main.rs"

[lib]
name = "inspecteye"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.33", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
thiserror = "2.0"
similar = "3.2.0"
tree-sitter = "0.25"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-c-sharp = "0.23.5"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3.17"
